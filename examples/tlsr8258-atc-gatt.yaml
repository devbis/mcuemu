# The ATC firmware (see tlsr8258-atc-ble.yaml) next to a ble_host part, an HCI controller for a host
# program outside: examples/tlsr8258-atc-gatt.py connects to it, reads the services, the
# characteristics and the Device Name over ATT and changes the connection interval.
#
#   mkdir -p /tmp/atc && cd /tmp/atc
#   /path/to/build/mcuemu sim /path/to/examples/tlsr8258-atc-gatt.yaml --speed 1 --for 14s &
#   python3 /path/to/examples/tlsr8258-atc-gatt.py 9011 13
#
# --speed 1 paces the virtual time with the wall clock so that the program can talk to the system.
version: 1

world:
  seed: 1
  duration: 20s
  radio:
    - id: air0

devices:
  - id: atc
    mcus:
      - id: mcu
        model: tlsr8258
        variant: F512
        firmware: ../firmware/atc_v59.bin
        radio: { air: air0, position: [0, 0, 1], tx_power_dbm: 4, protocols: [ble] }
    parts:
      - id: host
        type: ble_host
        radio: { air: air0, position: [1, 0, 1], protocols: [ble] }
        params: { address: "C0:DE:00:00:00:01" }

attach:
  - { endpoint: atc.host.hci, sink: "tcp:9011" }
  - { endpoint: air0, sink: "pcap:atc-gatt.pcap,ble" }
