# Tuya-style Zigbee smart plug with energy monitoring: a TLSR8258 module, a
# relay, a status LED, a push button and a BL0937 metering IC whose CF and CF1
# pulse outputs go to GPIO inputs (the firmware counts them) and whose SEL
# input is driven by a GPIO.
#
#   zb.<relay_pin>   -> relay coil driver (high = relay on)
#   zb.<led_pin>     -> status LED         (high = lit)
#   zb.<button_pin>  <- push button        (pulled up, low when pressed)
#   zb.<cf_pin>      <- BL0937 CF          (active power)
#   zb.<cf1_pin>     <- BL0937 CF1         (current or voltage, per SEL)
#   zb.<sel_pin>     -> BL0937 SEL         (low = current, high = voltage)
#
# Pin map and calibration are those of the Zbeacon TS011F plug board
# (zigbee-rs-plugs, board `tlsr8258-zbeacon-ts011f-bl0937`, 512 KiB flash):
# relay PD2 (active high), status LED PB1 (active low), button PA0 (active low),
# CF PB4, CF1 PB5, SEL PD3 (low = current, high = voltage). The calibration is
# the vendor's: current = CF1 * 200 / 16.162 mA, voltage = CF1 * 5 / 39.136 V,
# power = CF * 36 / 23.532 W. For another board pass its pins as params.
#
# No plug firmware ships with the repository: build it in zigbee-rs-plugs
# (build-tuya.sh) and pass `firmware`, or copy it to the default path.
version: 1

params:
  firmware: ../../firmware/tlsr8258-plug.bin
  variant: F512                   # flash size of the module (F512 or F1K)
  air: air0                       # radio medium defined in the world
  position: [0, 0, 0]             # meters
  tx_power_dbm: 10
  relay_pin: PD2
  led_pin: PB1
  led_active: low
  button_pin: PA0
  cf_pin: PB4
  cf1_pin: PB5
  sel_pin: PD3
  voltage_v: 230                  # mains voltage
  power_w: 0                      # load; change it at run time via <plug>.meter.power_w
  cf_hz_per_w: 0.6537             # 23.532 / 36
  cf1_hz_per_v: 7.827             # 39.136 / 5
  cf1_hz_per_a: 80.81             # 16.162 / 0.2
  meter_script: ../parts/bl0937.lua

device:
  id: plug
  mcus:
    - id: zb
      model: tlsr8258
      variant: "${variant}"
      firmware: "${firmware}"
      radio:
        air: "${air}"
        position: "${position}"
        tx_power_dbm: "${tx_power_dbm}"
        protocols: [zigbee]
  nets:
    - { id: relay,  pins: ["zb.${relay_pin}"] }
    - { id: led,    pins: ["zb.${led_pin}"] }
    - { id: button, pull: up, pins: ["zb.${button_pin}"] }
    - { id: cf,     pins: ["zb.${cf_pin}"] }
    - { id: cf1,    pins: ["zb.${cf1_pin}"] }
    - { id: sel,    pins: ["zb.${sel_pin}"] }
  parts:
    - { id: relay_led, type: led, pins: { in: relay } }
    - { id: status_led, type: led, pins: { in: led }, params: { active: "${led_active}" } }
    - { id: key, type: button, pins: { out: button } }
    - id: meter
      type: script
      script: "${meter_script}"
      pins: { cf: cf, cf1: cf1, sel: sel }
      params:
        voltage_v: "${voltage_v}"
        power_w: "${power_w}"
        cf_hz_per_w: "${cf_hz_per_w}"
        cf1_hz_per_v: "${cf1_hz_per_v}"
        cf1_hz_per_a: "${cf1_hz_per_a}"
