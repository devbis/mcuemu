# Tuya-style Zigbee smart plug with energy monitoring: a TLSR8258 module, a
# relay, a status LED, a push button and a BL0937 metering IC whose CF and CF1
# pulse outputs go to GPIO inputs (the firmware counts them) and whose SEL
# input is driven by a GPIO.
#
#   zb.<relay_pin>   -> relay coil driver (high = relay on)
#   zb.<led_pin>     -> status LED         (high = lit)
#   zb.<button_pin>  <- push button        (pulled up, low when pressed)
#   zb.<cf_pin>      <- BL0937 CF          (active power)
#   zb.<cf1_pin>     <- BL0937 CF1         (current or voltage, per SEL)
#   zb.<sel_pin>     -> BL0937 SEL         (low = current, high = voltage)
#
# No plug firmware ships with the repository: put your image at the default
# path or pass `firmware`. The pin numbers are typical placeholders; take the
# real ones from your board's schematic or firmware and pass them as params.
version: 1

params:
  firmware: ../../firmware/tuya_plug.bin
  air: air0                       # radio medium defined in the world
  position: [0, 0, 0]             # meters
  tx_power_dbm: 10
  relay_pin: PD2
  led_pin: PD3
  button_pin: PB4
  cf_pin: PB5
  cf1_pin: PC2
  sel_pin: PB1
  voltage_v: 230                  # mains voltage
  power_w: 0                      # load; change it at run time via <plug>.meter.power_w
  cf_hz_per_w: 0.5                # BL0937 calibration (see parts/bl0937.lua)
  cf1_hz_per_v: 8
  cf1_hz_per_a: 100
  meter_script: ../parts/bl0937.lua

device:
  id: plug
  mcus:
    - id: zb
      model: tlsr8258
      variant: F1K
      firmware: "${firmware}"
      radio:
        air: "${air}"
        position: "${position}"
        tx_power_dbm: "${tx_power_dbm}"
        protocols: [zigbee]
  nets:
    - { id: relay,  pins: ["zb.${relay_pin}"] }
    - { id: led,    pins: ["zb.${led_pin}"] }
    - { id: button, pull: up, pins: ["zb.${button_pin}"] }
    - { id: cf,     pins: ["zb.${cf_pin}"] }
    - { id: cf1,    pins: ["zb.${cf1_pin}"] }
    - { id: sel,    pins: ["zb.${sel_pin}"] }
  parts:
    - { id: relay_led, type: led, pins: { in: relay } }
    - { id: status_led, type: led, pins: { in: led } }
    - { id: key, type: button, pins: { out: button } }
    - id: meter
      type: script
      script: "${meter_script}"
      pins: { cf: cf, cf1: cf1, sel: sel }
      params:
        voltage_v: "${voltage_v}"
        power_w: "${power_w}"
        cf_hz_per_w: "${cf_hz_per_w}"
        cf1_hz_per_v: "${cf1_hz_per_v}"
        cf1_hz_per_a: "${cf1_hz_per_a}"
