# PB-03F Zephyr Zigbee end device with the TLSR8258 sample gateway.
# Build zigbee_shell for pb_03f and place the package at
# firmware/phy6252-zephyr-ed.bin; firmware images stay outside git.
version: 1

world:
  seed: 1
  duration: 30s
  radio:
    - id: air0
      model: log_distance
      reference_loss_db: 40
      path_loss_exponent: 2.5

devices:
  - id: coordinator
    mcus:
      - id: mcu
        model: tlsr8258
        variant: F1K
        firmware: ../firmware/telink-gw.bin
        radio: { air: air0, position: [0, 0, 1], tx_power_dbm: 10, protocols: [zigbee] }

  - id: pb03f
    mcus:
      - id: mcu
        model: phy6252
        firmware: ../firmware/phy6252-zephyr-ed.bin
        radio: { air: air0, position: [4, 0, 1], tx_power_dbm: 0, protocols: [zigbee] }

attach:
  - { endpoint: air0, sink: "pcap:air.pcap" }
