# CI scenario: the Tuya-style two-chip thermostat (CA51F253L3 main board and a
# ZT3L module) from the thermostat project's release images, next to a Telink
# sampleGW coordinator. Checked by tests/firmware/thermostat_check.py.
version: 1

world:
  seed: 1
  duration: 30s
  radio:
    - id: air0
      model: log_distance
      reference_loss_db: 40
      path_loss_exponent: 2.5

devices:
  - id: coordinator
    mcus:
      - id: zb
        model: tlsr8258
        variant: F1K
        firmware: ../../../firmware/telink-gw.bin
        radio: { air: air0, position: [0, 0, 1], tx_power_dbm: 10, protocols: [zigbee] }

  - include: ../../../examples/devices/tuya_thermostat.yaml
    id: thermostat
    params:
      zb_firmware: ../../firmware/thermostat-zt3l.bin
      main_firmware: ../../firmware/thermostat-ca51.bin
      position: [4, 2, 1]
      main_tx_log: hex        # CA51 -> ZT3L, to the console
      zb_tx_log: hex          # ZT3L -> CA51

attach:
  - { endpoint: air0, sink: "pcap:air.pcap" }
